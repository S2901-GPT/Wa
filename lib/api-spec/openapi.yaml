openapi: 3.1.0
info:
  title: Api
  version: 0.2.0
  description: واجهة طلبات بيانات إعلانات الوفاة
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: requests
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /obituary-requests:
    get:
      operationId: listObituaryRequests
      tags: [requests]
      responses:
        "200":
          description: قائمة الطلبات من الأحدث
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ObituaryRequest"
    post:
      operationId: createObituaryRequest
      tags: [requests]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ObituaryRequestInput"
      responses:
        "201":
          description: تم إنشاء الطلب
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObituaryRequest"
  /obituary-requests/{requestNumber}:
    get:
      operationId: getObituaryRequest
      tags: [requests]
      parameters:
        - $ref: "#/components/parameters/RequestNumber"
      responses:
        "200":
          description: تفاصيل الطلب
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObituaryRequest"
        "404":
          description: الطلب غير موجود
    put:
      operationId: updateObituaryRequest
      tags: [requests]
      parameters:
        - $ref: "#/components/parameters/RequestNumber"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ObituaryRequestUpdate"
      responses:
        "200":
          description: تم تحديث الطلب
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObituaryRequest"
        "404":
          description: الطلب غير موجود
components:
  parameters:
    RequestNumber:
      name: requestNumber
      in: path
      required: true
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
    DeceasedPerson:
      type: object
      required: [fullName, gender]
      properties:
        fullName:
          type: string
          minLength: 2
        gender:
          type: string
          enum: [man, woman, boy, girl, other]
        age:
          type: ["integer", "null"]
        nationality:
          type: string
        deathPlace:
          type: string
        title:
          type: string
        occupation:
          type: string
        note:
          type: string
    RelativePerson:
      type: object
      required: [name, deceased]
      properties:
        name:
          type: string
        occupation:
          type: string
        deceased:
          type: boolean
    RelativeGroup:
      type: object
      required: [relation, people]
      properties:
        relation:
          type: string
        familyReference:
          type: string
        people:
          type: array
          items:
            $ref: "#/components/schemas/RelativePerson"
    PrayerDetails:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
        day:
          type: string
        time:
          type: string
        place:
          type: string
        mapLink:
          type: string
    BurialDetails:
      type: object
      required: [status, outsideQatar]
      properties:
        status:
          type: string
          enum: [upcoming, completed]
        day:
          type: string
        time:
          type: string
        cemetery:
          type: string
        mapLink:
          type: string
        outsideQatar:
          type: boolean
        outsideLocation:
          type: string
    CondolenceCard:
      type: object
      required: [audience]
      properties:
        audience:
          type: string
          enum: [men, women]
        location:
          type: string
        mapLink:
          type: string
        start:
          type: string
        durationDays:
          type: ["integer", "null"]
        time:
          type: string
        houseNumber:
          type: string
        buildingNumber:
          type: string
        street:
          type: string
        area:
          type: string
        floor:
          type: string
        apartmentNumber:
          type: string
        locationNotes:
          type: string
    CondolencePhoneContact:
      type: object
      properties:
        name:
          type: string
        phone:
          type: string
    ObituaryRequestInput:
      type: object
      required:
        - deceasedPeople
        - relatives
        - prayer
        - burial
        - condolenceOptions
        - condolences
        - condolencePhoneContacts
      properties:
        deceasedPeople:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/DeceasedPerson"
        relatives:
          type: array
          items:
            $ref: "#/components/schemas/RelativeGroup"
        prayer:
          $ref: "#/components/schemas/PrayerDetails"
        burial:
          $ref: "#/components/schemas/BurialDetails"
        condolenceOptions:
          type: array
          items:
            type: string
            enum: [phone, men, women]
        condolences:
          type: array
          items:
            $ref: "#/components/schemas/CondolenceCard"
        condolencePhoneContacts:
          type: array
          items:
            $ref: "#/components/schemas/CondolencePhoneContact"
        notes:
          type: string
    ObituaryRequestUpdate:
      allOf:
        - $ref: "#/components/schemas/ObituaryRequestInput"
        - type: object
          required: [status]
          properties:
            status:
              type: string
              enum: [new, reviewing, ready, completed]
    ObituaryRequest:
      allOf:
        - $ref: "#/components/schemas/ObituaryRequestInput"
        - type: object
          required: [id, requestNumber, createdAt, updatedAt, status]
          properties:
            id:
              type: integer
            requestNumber:
              type: string
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
            status:
              type: string
              enum: [new, reviewing, ready, completed]