openapi: 3.1.0
info:
  title: Api
  version: 0.3.0
  description: واجهة طلبات بيانات إعلانات الوفاة
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: requests
  - name: admin
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /obituary-requests:
    get:
      operationId: listObituaryRequests
      tags: [requests]
      description: للمسؤول فقط
      responses:
        "200":
          description: قائمة الطلبات من الأحدث
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ObituaryRequest"
        "401":
          description: يلزم تسجيل الدخول كمسؤول
    post:
      operationId: createObituaryRequest
      tags: [requests]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ObituaryRequestInput"
      responses:
        "201":
          description: تم إنشاء الطلب
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObituaryRequest"
  /obituary-requests/{requestNumber}:
    get:
      operationId: getObituaryRequest
      tags: [requests]
      parameters:
        - $ref: "#/components/parameters/RequestNumber"
      responses:
        "200":
          description: تفاصيل الطلب
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObituaryRequest"
        "404":
          description: الطلب غير موجود
        "429":
          description: محاولات بحث كثيرة، حاول لاحقاً
    put:
      operationId: updateObituaryRequest
      tags: [requests]
      parameters:
        - $ref: "#/components/parameters/RequestNumber"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ObituaryRequestUpdate"
      description: للمسؤول فقط
      responses:
        "200":
          description: تم تحديث الطلب
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObituaryRequest"
        "401":
          description: يلزم تسجيل الدخول كمسؤول
        "404":
          description: الطلب غير موجود
    delete:
      operationId: deleteObituaryRequest
      tags: [requests]
      description: للمسؤول فقط
      parameters:
        - $ref: "#/components/parameters/RequestNumber"
      responses:
        "204":
          description: تم حذف الطلب
        "401":
          description: يلزم تسجيل الدخول كمسؤول
        "404":
          description: الطلب غير موجود
  /lab/obituary-requests:
    get:
      operationId: listLabObituaryRequests
      tags: [lab]
      description: طلبات التجارب (مجموعة مستقلة)، للمسؤول فقط
      responses:
        "200":
          description: قائمة الطلبات من الأحدث
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ObituaryRequest"
        "401":
          description: يلزم تسجيل الدخول كمسؤول
    post:
      operationId: createLabObituaryRequest
      tags: [lab]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ObituaryRequestInput"
      responses:
        "201":
          description: تم إنشاء الطلب
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObituaryRequest"
  /lab/obituary-requests/{requestNumber}:
    get:
      operationId: getLabObituaryRequest
      tags: [lab]
      parameters:
        - $ref: "#/components/parameters/RequestNumber"
      responses:
        "200":
          description: تفاصيل الطلب
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObituaryRequest"
        "404":
          description: الطلب غير موجود
        "401":
          description: يلزم تسجيل الدخول كمسؤول
    put:
      operationId: updateLabObituaryRequest
      tags: [lab]
      parameters:
        - $ref: "#/components/parameters/RequestNumber"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ObituaryRequestUpdate"
      description: طلبات التجارب (مجموعة مستقلة)، للمسؤول فقط
      responses:
        "200":
          description: تم تحديث الطلب
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObituaryRequest"
        "401":
          description: يلزم تسجيل الدخول كمسؤول
        "404":
          description: الطلب غير موجود
    delete:
      operationId: deleteLabObituaryRequest
      tags: [lab]
      description: طلبات التجارب (مجموعة مستقلة)، للمسؤول فقط
      parameters:
        - $ref: "#/components/parameters/RequestNumber"
      responses:
        "204":
          description: تم حذف الطلب
        "401":
          description: يلزم تسجيل الدخول كمسؤول
        "404":
          description: الطلب غير موجود
  /lab/status:
    get:
      operationId: getLabStatus
      tags: [lab]
      description: حالة مجموعات التجارب — عدد الطلبات، وهل قواعد Firestore منشورة لكل مجموعة
      responses:
        "200":
          description: حالة التجارب
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabStatus"
        "401":
          description: يلزم تسجيل الدخول كمسؤول
  /lab/import:
    post:
      operationId: importLabRequests
      tags: [lab]
      description: نسخ كل الطلبات الحية إلى التجارب (استبدالاً بالرقم نفسه)
      responses:
        "200":
          description: عدد الطلبات المنسوخة
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabCount"
        "401":
          description: يلزم تسجيل الدخول كمسؤول
        "503":
          description: قواعد Firestore لمجموعة التجارب غير منشورة
  /lab/reset:
    post:
      operationId: resetLabRequests
      tags: [lab]
      description: حذف كل طلبات التجارب
      responses:
        "200":
          description: عدد الطلبات المحذوفة
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabCount"
        "401":
          description: يلزم تسجيل الدخول كمسؤول
        "503":
          description: قواعد Firestore لمجموعة التجارب غير منشورة
  /admin/session:
    get:
      operationId: getAdminSession
      tags: [admin]
      responses:
        "200":
          description: حالة جلسة المسؤول
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
  /admin/settings:
    get:
      operationId: getPosterSettings
      tags: [admin]
      description: إعدادات هوية صورة التعزية (الشعار واسم الحساب وأيقونات التواصل والطول الأقصى). للمسؤول فقط
      responses:
        "200":
          description: الإعدادات الحالية (أو الافتراضية)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosterSettings"
        "401":
          description: يلزم تسجيل الدخول كمسؤول
    put:
      operationId: savePosterSettings
      tags: [admin]
      description: للمسؤول فقط
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PosterSettings"
      responses:
        "200":
          description: الإعدادات بعد الحفظ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosterSettings"
        "400":
          description: إعدادات غير صالحة
        "401":
          description: يلزم تسجيل الدخول كمسؤول
        "500":
          description: تعذر الحفظ
  /admin/parse-text:
    post:
      operationId: parseObituaryText
      tags: [admin]
      description: يحوّل نص إعلان وصل للمسؤول (من واتساب أو غيره) إلى بيانات طلب بالذكاء الاصطناعي دون حفظه، ليراجعه المسؤول ثم يحفظه. للمسؤول فقط
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParseTextInput"
      responses:
        "200":
          description: بيانات الطلب المستخرجة مع ملاحظات عمّا لم يتضح في النص
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParseTextResult"
        "400":
          description: النص فارغ أو طويل جداً
        "401":
          description: يلزم تسجيل الدخول كمسؤول
        "422":
          description: لم يُعثر في النص على بيانات إعلان وفاة
        "429":
          description: طلبات كثيرة، حاول بعد قليل
        "502":
          description: تعذر الحصول على نتيجة من الذكاء الاصطناعي
        "503":
          description: خدمة الذكاء الاصطناعي غير مفعّلة على الخادم
  /admin/login:
    post:
      operationId: adminLogin
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginInput"
      responses:
        "200":
          description: تم تسجيل الدخول (تُرسل الجلسة في ملف تعريف ارتباط HttpOnly)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "401":
          description: كلمة المرور غير صحيحة
        "429":
          description: محاولات خاطئة كثيرة، حاول لاحقاً
        "503":
          description: كلمة مرور المسؤول لم تُضبط في الخادم أو ضعيفة
  /admin/logout:
    post:
      operationId: adminLogout
      tags: [admin]
      responses:
        "200":
          description: تم تسجيل الخروج
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
components:
  parameters:
    RequestNumber:
      name: requestNumber
      in: path
      required: true
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
    LabStoreState:
      type: string
      description: ok تعمل، rules-missing قواعد Firestore غير منشورة للمجموعة، offline لا اتصال بقاعدة البيانات
      enum: [ok, rules-missing, offline]
    LabStatus:
      type: object
      required: [count, labRequests]
      properties:
        count:
          type: integer
          description: عدد طلبات التجارب الحالية
        labRequests:
          $ref: "#/components/schemas/LabStoreState"
    LabCount:
      type: object
      required: [count]
      properties:
        count:
          type: integer
    AdminSession:
      type: object
      required: [authenticated, configured]
      properties:
        authenticated:
          type: boolean
        configured:
          type: boolean
          description: كلمة مرور المسؤول مضبوطة في الخادم وقوية بما يكفي
    PosterSettings:
      type: object
      required: [logoDataUrl, handle, socials, maxHeight]
      properties:
        logoDataUrl:
          type: string
          maxLength: 300000
          description: الشعار كـ data URL (PNG أو JPEG أو WebP) أو نص فارغ بلا شعار
        handle:
          type: string
          maxLength: 60
          description: اسم الحساب الظاهر تحت أيقونات التواصل
        socials:
          type: array
          maxItems: 3
          items:
            type: string
            enum: [instagram, snapchat, x]
        maxHeight:
          type: integer
          minimum: 1350
          maximum: 1800
          description: الصورة تبدأ بطول 1350 وتطول عند الحاجة حتى هذا الحد
    ParseTextInput:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 8000
    ParseTextResult:
      type: object
      required: [request, warnings]
      properties:
        request:
          $ref: "#/components/schemas/ObituaryRequestInput"
        warnings:
          type: array
          description: ما لم يتضح في النص ويستحق المراجعة قبل الحفظ
          items:
            type: string
        debug:
          type: string
          description: ردّ النموذج مختصراً عندما يفشل في استخراج البيانات الأساسية، للتشخيص فقط
        raw:
          type: string
          description: ردّ النموذج كما هو (حتى 8192 حرفاً)، يُحفظ في سجل الطلب
        model:
          type: string
          description: النموذج الذي أعطى النتيجة
    AdminLoginInput:
      type: object
      required: [password]
      properties:
        password:
          type: string
          maxLength: 200
    LinkedPerson:
      type: object
      description: شخص مرجعي (الزوج، الأب، الأب المشترك، أو مرجع «أبناء /») مع حالته
      properties:
        title:
          type: string
        name:
          type: string
        deceased:
          type: boolean
    SpouseReference:
      type: object
      description: زوج المتوفاة؛ النوع يحدد «حرم» أو «أرملة»
      properties:
        kind:
          type: string
          enum: [harem, widow]
        title:
          type: string
        name:
          type: string
        deceased:
          type: boolean
    DeceasedPerson:
      type: object
      required: [gender]
      properties:
        fullName:
          type: string
        gender:
          type: string
          enum: [man, woman, boy, girl, other]
        identifyBy:
          type: string
          description: طريقة التعريف بالمتوفى في رأس الإعلان
          enum: [name, kunya, spouse, father, children]
        kunya:
          type: string
        age:
          type: ["integer", "null"]
        ageUnit:
          type: string
          enum: [years, months, days]
        nationality:
          type: string
        deathPlace:
          type: string
        title:
          type: string
        occupation:
          type: string
        note:
          type: string
        noChildren:
          type: boolean
        spouse:
          $ref: "#/components/schemas/SpouseReference"
        father:
          $ref: "#/components/schemas/LinkedPerson"
    RelativePerson:
      type: object
      required: [name, deceased]
      properties:
        name:
          type: string
        occupation:
          type: string
        deceased:
          type: boolean
    RelativeGroup:
      type: object
      required: [relation, people]
      properties:
        relation:
          type: string
        relationKey:
          type: string
          description: صلة الأشخاص بالمتوفى؛ يُشتق منها عنوان الإعلان مثل «والدة كل من»
          enum:
            - children
            - full_siblings
            - siblings
            - grandchildren
            - brothers_children
            - sisters_children
            - father
            - grandfather
            - paternal_uncles
            - maternal_uncles
            - daughters_husbands
            - sisters_husbands
            - other
        familyReference:
          type: string
        reference:
          $ref: "#/components/schemas/LinkedPerson"
        deceasedPlacement:
          type: string
          enum: [auto, inline, grouped]
        deceasedIndex:
          type: ["integer", "null"]
        people:
          type: array
          items:
            $ref: "#/components/schemas/RelativePerson"
    PrayerDetails:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
        day:
          type: string
        weekday:
          type: string
        time:
          type: string
        place:
          type: string
        mapLink:
          type: string
    BurialDetails:
      type: object
      required: [status, outsideQatar]
      properties:
        status:
          type: string
          enum: [upcoming, completed, postponed]
        day:
          type: string
        weekday:
          type: string
        time:
          type: string
        cemetery:
          type: string
        mapLink:
          type: string
        outsideQatar:
          type: boolean
        outsideLocation:
          type: string
        note:
          type: string
          description: ملاحظة الدفن (سبب التأجيل، أو وصف دفن تمّ مثل «تم الدفن في مكة المكرمة»)
    CondolenceScheduleEntry:
      type: object
      properties:
        days:
          type: string
        time:
          type: string
    CondolenceCard:
      type: object
      required: [audience]
      properties:
        audience:
          type: string
          enum: [men, women]
        location:
          type: string
        mapLink:
          type: string
        start:
          type: string
        durationDays:
          type: ["integer", "null"]
        time:
          type: string
        houseNumber:
          type: string
        buildingNumber:
          type: string
        street:
          type: string
        area:
          type: string
        floor:
          type: string
        apartmentNumber:
          type: string
        locationNotes:
          type: string
        until:
          type: string
        schedule:
          type: array
          items:
            $ref: "#/components/schemas/CondolenceScheduleEntry"
        deceasedIndex:
          type: ["integer", "null"]
    CondolenceCancellation:
      type: object
      properties:
        audience:
          type: string
          enum: [men, women, all]
        from:
          type: string
        reason:
          type: string
        phoneOnly:
          type: boolean
    AuditInfo:
      type: object
      description: من أين جاء الطلب أو التعديل. للجمهور تُفرض القناة form ولا يُقبل شيء آخر.
      required: [channel]
      properties:
        channel:
          type: string
          enum: [form, from_text, admin_edit]
        sourceText:
          type: string
          maxLength: 8000
          description: النص الملصوق في «طلب من نص»
        aiWarnings:
          type: array
          maxItems: 20
          items:
            type: string
        aiReply:
          type: string
          maxLength: 8192
        model:
          type: string
          maxLength: 60
        inferred:
          type: boolean
          description: استُنتج لاحقاً من سجلات الخادم لطلب أقدم من تفعيل السجل (لا نص أصلي ولا تفاصيل تعديلات)
    HistoryEntry:
      type: object
      required: [at, channel, changes]
      properties:
        at:
          type: string
          format: date-time
        channel:
          type: string
          enum: [form, from_text, admin_edit]
        changes:
          type: array
          items:
            type: string
        sourceText:
          type: string
          description: نص «طلب من نص» حين جاء التعديل منه
        aiWarnings:
          type: array
          items:
            type: string
    ObituaryRequestInput:
      type: object
      required:
        - deceasedPeople
        - relatives
        - prayer
        - burial
        - condolenceOptions
        - condolences
      properties:
        audit:
          $ref: "#/components/schemas/AuditInfo"
        messageType:
          type: string
          description: نوع الرسالة (إعلان، تأجيل، تعديل، إلغاء عزاء)
          enum: [announcement, postponement, amendment, condolence_cancellation]
        relatedRequestNumber:
          type: string
        announcementMode:
          type: string
          description: صيغة الإعلان عند تعدد المتوفين
          enum: [single, unrelated, siblings, father_first, mother_child]
        sharedParent:
          $ref: "#/components/schemas/LinkedPerson"
        cancellation:
          $ref: "#/components/schemas/CondolenceCancellation"
        deceasedPeople:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/DeceasedPerson"
        relatives:
          type: array
          items:
            $ref: "#/components/schemas/RelativeGroup"
        noRelatives:
          type: boolean
          description: أكّد المرسل أن المتوفى ليس لديه أقارب يُذكرون
        prayer:
          $ref: "#/components/schemas/PrayerDetails"
        burial:
          $ref: "#/components/schemas/BurialDetails"
        condolenceOptions:
          type: array
          items:
            type: string
            enum: [phone, men, women, men_cemetery, tbd]
        phoneAudience:
          type: string
          enum: [all, men, women]
        condolenceNote:
          type: string
        condolences:
          type: array
          items:
            $ref: "#/components/schemas/CondolenceCard"
        notes:
          type: string
    ObituaryRequestUpdate:
      allOf:
        - $ref: "#/components/schemas/ObituaryRequestInput"
        - type: object
          required: [status]
          properties:
            status:
              type: string
              enum: [new, reviewing, ready, completed]
    ObituaryRequest:
      allOf:
        - $ref: "#/components/schemas/ObituaryRequestInput"
        - type: object
          required: [id, requestNumber, createdAt, updatedAt, status]
          properties:
            id:
              type: integer
            requestNumber:
              type: string
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
            status:
              type: string
              enum: [new, reviewing, ready, completed]
            history:
              type: array
              description: سجل الإنشاء والتعديلات (للمسؤول فقط)
              items:
                $ref: "#/components/schemas/HistoryEntry"